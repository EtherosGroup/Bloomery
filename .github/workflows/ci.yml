# 仓库 CI：类型检查、格式检查、打包核对、安装冒烟
#
# 触发：推 master 与所有 PR。master 上有「必须走 PR」的保护规则，因此 PR 是主要入口
# 不需要任何密钥
#
# dist/ 由构建生成且在 .gitignore 里，因此发布包内容只能在 CI 里构建后核对
# 冒烟 job 装的是 tarball 而不是源码目录：Node 拒绝处理 node_modules 下的 .ts，
# 只有装成包跑一遍才能验证真实的发布形态

name: ci

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        # 固定镜像版本：ubuntu-latest 会随 GitHub 的迁移计划更换，构建环境不应随之改变
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run check

            - run: npm run fmt:check

            # npm pack 会先跑 prepack（即构建），这里不必再单独 build
            - name: 打包并核对清单
              run: |
                  set -euo pipefail
                  npm pack 2>&1 | tee /tmp/pack.txt
                  # dist/main.js 是 bin 的指向，少一个字节装完都是不能用的空壳
                  grep -q "dist/main.js" /tmp/pack.txt
                  grep -q "dist/cli/parse.js" /tmp/pack.txt
                  grep -E "total files|package size|unpacked size" /tmp/pack.txt

            - uses: actions/upload-artifact@v7
              with:
                  name: tarball-${{ github.sha }}
                  path: "*.tgz"
                  if-no-files-found: error

    # engines 声明的是 >=20，因此真的装到那三个版本上跑一遍
    smoke:
        needs: check
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/download-artifact@v7
              with:
                  name: tarball-${{ github.sha }}

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}

            - name: 装进空项目并跑起来
              run: |
                  set -euo pipefail
                  mkdir -p /tmp/consumer
                  cd /tmp/consumer
                  npm init -y >/dev/null
                  npm i --no-audit --no-fund "$GITHUB_WORKSPACE"/*.tgz
                  ./node_modules/.bin/bloomery --help | grep -q "Bloomery Minecraft 启动器"

                  # 用法错误固定给退出码 2
                  set +e
                  ./node_modules/.bin/bloomery nope >/dev/null 2>&1
                  code=$?
                  set -e
                  test "$code" = "2" || {
                      echo "未知命令的退出码是 $code，期望 2"
                      exit 1
                  }
                  echo "node ${{ matrix.node }} 上装包可用"
